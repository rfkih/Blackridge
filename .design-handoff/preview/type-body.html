<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: var(--bg-base); }
  .row { display: flex; align-items: baseline; gap: 16px; padding: 6px 0; border-bottom: 1px solid var(--ink-50); }
  .row:last-child { border-bottom: 0; }
  .tag { width: 92px; flex: none; font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; font-weight: 700; color: var(--text-muted); }
  .meta { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); flex: none; }
</style></head>
<body>
  <div class="row"><span class="tag">Body lg</span><span class="body-lg">Invest in fractions of US stocks from $1.</span><span class="meta">17 · 400</span></div>
  <div class="row"><span class="tag">Body</span><span class="body" style="color: var(--text-primary)">Your account is protected for up to USD 500,000.</span><span class="meta">15 · 400</span></div>
  <div class="row"><span class="tag">Caption</span><span class="caption">Updated 2 minutes ago</span><span class="meta">13 · 400</span></div>
  <div class="row"><span class="tag">Micro</span><span class="micro">Today's P&amp;L</span><span class="meta">11 · 600 · 0.04em</span></div>
  <div class="row"><span class="tag">Mono num</span><span class="mono num" style="font-size:15px">+1,247.92 USDT</span><span class="meta">JetBrains Mono · tnum</span></div>
  <div class="row"><span class="tag">Mono code</span><span class="mono" style="font-size:13px;color: var(--text-secondary)">/api/v1/trades?status=OPEN</span><span class="meta">13 · 400</span></div>
</body></html>
