<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: var(--bg-base); }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .sw { aspect-ratio: 1; border-radius: var(--radius-md); position: relative; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.04); }
  .sw .hex { position: absolute; left: 8px; bottom: 6px; font-family: var(--font-mono); font-size: 10px; color: rgba(255,255,255,0.95); font-weight: 600; }
  .sw.light .hex { color: var(--ink-700); }
  .lbl { font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; font-weight: 700; color: var(--text-muted); margin: 0 0 8px; }
</style></head>
<body>
  <div class="lbl">Brand · emerald</div>
  <div class="grid">
    <div class="sw light" style="background:#E8F8EE"><span class="hex">50 · E8F8EE</span></div>
    <div class="sw light" style="background:#C8EED5"><span class="hex">100 · C8EED5</span></div>
    <div class="sw light" style="background:#97DEB1"><span class="hex">200 · 97DEB1</span></div>
    <div class="sw" style="background:#5FCB8B"><span class="hex">300 · 5FCB8B</span></div>
    <div class="sw" style="background:#2EBC72"><span class="hex">400 · 2EBC72</span></div>
    <div class="sw" style="background:#16B364; box-shadow: inset 0 0 0 2px rgba(255,255,255,0.6)"><span class="hex">500 · 16B364 ★</span></div>
    <div class="sw" style="background:#0E9F50"><span class="hex">600 · 0E9F50</span></div>
    <div class="sw" style="background:#0A7E3F"><span class="hex">700 · 0A7E3F</span></div>
    <div class="sw" style="background:#075E2F"><span class="hex">800 · 075E2F</span></div>
    <div class="sw" style="background:#054020"><span class="hex">900 · 054020</span></div>
  </div>
</body></html>
