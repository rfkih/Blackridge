<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Machiavelli Technology</title>
<link rel="stylesheet" href="colors_and_type.css">
<style>
  body { margin: 0; min-height: 100vh; background: #FAFAF7; font-family: var(--font-sans); color: var(--ink-900); }

  /* Top bar */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: 22px 32px; z-index: 10;
  }
  .brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; }
  .brand img { width: 26px; height: 26px; }
  .brand .name { font-family: var(--font-display); font-weight: 800; font-size: 14px; letter-spacing: -0.01em; color: var(--ink-900); }
  .brand .tag { font-size: 9px; letter-spacing: 0.2em; color: var(--text-muted); margin-top: 1px; text-transform: uppercase; font-weight: 600; }
  .top-link { font-size: 13px; color: var(--text-secondary); text-decoration: none; font-weight: 500; }
  .top-link strong { color: var(--ink-900); margin-left: 4px; font-weight: 700; }

  /* MAIN — single centered card on a textured cream canvas */
  .stage {
    min-height: 100vh;
    display: grid; place-items: center;
    padding: 100px 24px 60px;
    box-sizing: border-box;
    position: relative;
    background:
      radial-gradient(ellipse 60% 50% at 50% 0%, rgba(22,179,100,0.06) 0%, transparent 70%),
      radial-gradient(ellipse 80% 60% at 50% 100%, rgba(22,179,100,0.04) 0%, transparent 70%),
      #FAFAF7;
  }

  /* Subtle grid */
  .stage::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(14,17,22,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(14,17,22,0.025) 1px, transparent 1px);
    background-size: 80px 80px;
    mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black, transparent 90%);
    pointer-events: none;
  }

  .card {
    position: relative; z-index: 1;
    width: 100%; max-width: 440px;
    background: #fff;
    border: 1px solid var(--ink-100);
    border-radius: 24px;
    padding: 40px 40px 32px;
    box-sizing: border-box;
    box-shadow: 0 1px 0 rgba(255,255,255,0.6) inset, 0 24px 60px -20px rgba(14,17,22,0.18), 0 8px 20px -8px rgba(14,17,22,0.08);
  }
  @media (max-width: 480px) { .card { padding: 32px 24px 24px; border-radius: 20px; } }

  /* Knight mark inside circle */
  .mark {
    width: 60px; height: 60px; border-radius: 50%;
    background: linear-gradient(160deg, #16241B 0%, #0A0F0C 100%);
    display: grid; place-items: center;
    margin-bottom: 24px;
    box-shadow: 0 8px 20px -8px rgba(14,17,22,0.4), 0 0 0 6px rgba(22,179,100,0.06);
  }
  .mark svg { width: 38px; height: 38px; }

  h1 { font-family: var(--font-display); font-size: 28px; font-weight: 800; letter-spacing: -0.025em; line-height: 1.1; margin: 0 0 6px; }
  .lead { font-size: 14px; color: var(--text-secondary); margin: 0 0 24px; line-height: 1.5; }

  /* SSO row — 3 buttons */
  .sso { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 18px; }
  .sso button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 11px 8px; background: #fff; border: 1px solid var(--ink-100); border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; color: var(--ink-900); transition: all 150ms; }
  .sso button:hover { border-color: var(--ink-200); background: var(--bg-surface); transform: translateY(-1px); }

  .or-sep { display: flex; align-items: center; gap: 12px; margin: 6px 0 18px; font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; }
  .or-sep::before, .or-sep::after { content: ""; flex: 1; height: 1px; background: var(--ink-100); }

  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 11px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em; }
  .field .row { display: flex; justify-content: space-between; align-items: baseline; }
  .field .row a { font-size: 11px; color: var(--brand-700); font-weight: 600; text-decoration: none; }
  .input { width: 100%; padding: 12px 14px; border: 1px solid var(--ink-100); border-radius: 10px; font-size: 14px; font-family: inherit; box-sizing: border-box; background: #fff; color: var(--ink-900); }
  .input:focus { outline: none; border-color: var(--brand-500); box-shadow: var(--shadow-focus-ring); }

  .check-row { display: flex; gap: 10px; align-items: center; font-size: 12px; color: var(--text-secondary); margin: 12px 0 18px; }
  .check-row input { width: 15px; height: 15px; accent-color: var(--brand-500); }

  .submit { width: 100%; padding: 14px; background: var(--ink-900); color: #fff; border: none; border-radius: 12px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: all 150ms; }
  .submit:hover { background: #000; transform: translateY(-1px); box-shadow: 0 8px 20px -8px rgba(0,0,0,0.4); }

  .legal { text-align: center; font-size: 11px; color: var(--text-muted); margin-top: 16px; line-height: 1.5; }
  .legal a { color: var(--text-secondary); text-decoration: underline; text-decoration-color: var(--ink-100); }

  /* Trust strip below card */
  .trust {
    margin-top: 32px;
    display: flex; justify-content: center; align-items: center; gap: 24px;
    font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600;
    flex-wrap: wrap;
  }
  .trust .item { display: inline-flex; align-items: center; gap: 6px; }
  .trust svg { color: var(--brand-500); }
  .trust .sep { width: 4px; height: 4px; border-radius: 50%; background: var(--ink-200); }
</style>
</head>
<body data-screen-label="Sign in">

<div class="topbar">
  <a href="website.html" class="brand">
    <img src="assets/logo-mark.svg" alt="">
    <div><div class="name">Machiavelli</div><div class="tag">Technology</div></div>
  </a>
  <div>
    <span class="top-link">New here? <a href="#" style="color:inherit;text-decoration:none;"><strong>Create account →</strong></a></span>
  </div>
</div>

<main class="stage">
  <div>
    <div class="card">
      <div class="mark">
        <svg viewBox="0 0 100 100">
          <defs>
            <linearGradient id="kg" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#86E0AA"/>
              <stop offset="100%" stop-color="#16B364"/>
            </linearGradient>
          </defs>
          <path d="M 30 88 L 30 78 C 30 72, 32 68, 35 64 L 32 60 L 28 56 L 30 50 C 28 46, 28 42, 30 38 L 36 30 C 40 22, 48 16, 56 14 L 60 8 L 62 14 L 60 18 L 64 22 L 70 22 L 72 28 L 68 30 L 70 36 L 66 38 L 70 44 L 66 48 L 72 54 L 70 60 L 64 62 L 62 70 L 60 76 L 60 88 Z"
                fill="url(#kg)" stroke="#5FCB8B" stroke-width="0.6" stroke-linejoin="round"/>
          <circle cx="56" cy="32" r="1.5" fill="#0E1116"/>
        </svg>
      </div>

      <h1>Sign in to Machiavelli</h1>
      <p class="lead">Pick up where you left off. Your bots have been running.</p>

      <div class="sso">
        <button title="Google">
          <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Google
        </button>
        <button title="Apple">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
          Apple
        </button>
        <button title="Wallet">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="14" rx="3"/><path d="M16 14h2"/><path d="M2 10h20"/></svg>
          Wallet
        </button>
      </div>

      <div class="or-sep">or</div>

      <div class="field">
        <label>Email</label>
        <input class="input" type="email" placeholder="you@example.com">
      </div>
      <div class="field">
        <div class="row">
          <label>Password</label>
          <a href="#">Forgot?</a>
        </div>
        <input class="input" type="password" placeholder="••••••••••••">
      </div>

      <label class="check-row">
        <input type="checkbox" checked>
        <span>Keep me signed in for 30 days</span>
      </label>

      <button class="submit">
        Sign in
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>

      <div class="legal">
        Protected by 2FA. We never custody funds.<br>
        By continuing you agree to our <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.
      </div>
    </div>

    <div class="trust">
      <div class="item">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2L4 6v6c0 5 3.5 9 8 10 4.5-1 8-5 8-10V6l-8-4z"/></svg>
        SOC 2 Type II
      </div>
      <span class="sep"></span>
      <div class="item">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        2FA Required
      </div>
      <span class="sep"></span>
      <div class="item">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
        25ms Latency
      </div>
      <span class="sep"></span>
      <div class="item">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg>
        Non-custodial
      </div>
    </div>
  </div>
</main>

</body>
</html>
