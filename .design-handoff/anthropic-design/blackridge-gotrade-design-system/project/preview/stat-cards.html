<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: var(--bg-surface); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .card { background: var(--bg-elevated); border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow-sm); border: 1px solid var(--ink-100); }
  .stat .lbl { font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; }
  .stat .num { font-family: var(--font-display); font-size: 28px; font-weight: 800; letter-spacing: -0.02em; color: var(--text-primary); font-variant-numeric: tabular-nums; }
  .stat .delta { font-family: var(--font-mono); font-size: 12px; font-weight: 600; margin-top: 4px; display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: var(--radius-pill); }
  .delta.up { color: var(--color-profit); background: var(--tint-profit); }
  .delta.down { color: var(--color-loss); background: var(--tint-loss); }
</style></head>
<body>
  <div class="grid">
    <div class="card stat"><div class="lbl">Total P&amp;L</div><div class="num">+$12,847.20</div><span class="delta up">▲ +4.2% today</span></div>
    <div class="card stat"><div class="lbl">Open positions</div><div class="num">14</div><span class="delta up">▲ 3 new</span></div>
    <div class="card stat"><div class="lbl">Win rate · 30d</div><div class="num">68.4%</div><span class="delta up">▲ +2.1pp</span></div>
    <div class="card stat"><div class="lbl">Drawdown</div><div class="num">−2.8%</div><span class="delta down">▼ −0.6pp</span></div>
  </div>
</body></html>
