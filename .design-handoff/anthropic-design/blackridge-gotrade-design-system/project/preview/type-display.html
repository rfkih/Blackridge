<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: var(--bg-base); }
  .row { display: flex; align-items: baseline; gap: 16px; padding: 8px 0; border-bottom: 1px solid var(--ink-50); }
  .row:last-child { border-bottom: 0; }
  .tag { width: 92px; flex: none; font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; font-weight: 700; color: var(--text-muted); }
  .meta { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); flex: none; }
</style></head>
<body>
  <div class="row"><span class="tag">Display 2xl</span><span class="display-2xl" style="font-size:48px;line-height:1">$1,247.92</span><span class="meta">56 · 800 · −0.03em</span></div>
  <div class="row"><span class="tag">Display xl</span><span class="display-xl" style="font-size:38px">Make it grow</span><span class="meta">44 · 800 · −0.025em</span></div>
  <div class="row"><span class="tag">Display lg</span><span class="display-lg" style="font-size:32px">Friendly fintech</span><span class="meta">36 · 700 · −0.02em</span></div>
  <div class="row"><span class="tag">H1</span><span class="h1">Today's positions</span><span class="meta">28 · 700</span></div>
  <div class="row"><span class="tag">H2</span><span class="h2">Open trades</span><span class="meta">22 · 600</span></div>
  <div class="row"><span class="tag">H3</span><span class="h3">Strategy LSR_V2</span><span class="meta">18 · 600</span></div>
</body></html>
