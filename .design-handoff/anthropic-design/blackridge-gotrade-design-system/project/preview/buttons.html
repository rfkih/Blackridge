<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: var(--bg-base); }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .btn { font-family: var(--font-body); font-size: 15px; font-weight: 600; border: 0; cursor: pointer; padding: 12px 22px; border-radius: var(--radius-pill); transition: all var(--dur-fast) var(--ease-out); display: inline-flex; align-items: center; gap: 8px; }
  .btn:active { transform: scale(0.98); }
  .btn.primary { background: var(--brand-500); color: #fff; box-shadow: var(--shadow-sm); }
  .btn.primary:hover { background: var(--brand-600); box-shadow: var(--shadow-glow-brand); transform: translateY(-1px); }
  .btn.secondary { background: var(--brand-50); color: var(--brand-700); }
  .btn.secondary:hover { background: var(--brand-100); }
  .btn.ghost { background: transparent; color: var(--text-primary); }
  .btn.ghost:hover { background: var(--bg-hover); }
  .btn.outline { background: #fff; color: var(--text-primary); box-shadow: inset 0 0 0 1px var(--ink-100); }
  .btn.outline:hover { box-shadow: inset 0 0 0 1px var(--ink-200); background: var(--bg-hover); }
  .btn.danger { background: var(--color-loss); color: #fff; }
  .btn.sm { padding: 8px 14px; font-size: 13px; }
  .lbl { font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; font-weight: 700; color: var(--text-muted); margin: 0 0 12px; }
</style></head>
<body>
  <div class="lbl">Buttons</div>
  <div class="row">
    <button class="btn primary">Open account</button>
    <button class="btn secondary">Deposit</button>
    <button class="btn outline">Cancel</button>
    <button class="btn ghost">Skip</button>
    <button class="btn danger">Close position</button>
  </div>
  <div class="row" style="margin-top:14px">
    <button class="btn primary sm">Buy AAPL</button>
    <button class="btn secondary sm">Sell</button>
    <button class="btn outline sm">Filter</button>
  </div>
</body></html>
