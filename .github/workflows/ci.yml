name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false  # never cancel master builds — a half-shipped deploy is worse than a slow queue

# Least-privilege at the workflow level. Individual jobs cannot escalate beyond this.
# - contents: write — required so the deploy job can push the deploy/prod/<sha> tag.
# - actions: read — for downloading own build artifact across jobs.
# - deployments: write — populates the Deployments tab in the blackridge environment.
permissions:
  contents: write
  actions: read
  deployments: write

jobs:
  test:
    name: Build (lint/typecheck skipped for now)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to commit SHAs (supply-chain hardening). Update the SHA
      # AND the trailing `# vX.Y.Z` comment together; never trust a moving major tag.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20.x"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Lint + typecheck are intentionally skipped right now. The working tree has CRLF
      # line endings that trip prettier, and there are pre-existing tsc complaints that
      # aren't tied to this CI rollout. Build is the gate: a green build means the bundle
      # ships. Re-enable lint/typecheck once those debts are paid down.

      - name: Build
        # Build-time NEXT_PUBLIC_* are baked into the bundle. Values come from repo
        # variables when set; localhost fallbacks let the build succeed on a fresh
        # clone without any secrets configured.
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:8080' }}
          NEXT_PUBLIC_RESEARCH_URL: ${{ vars.NEXT_PUBLIC_RESEARCH_URL || 'http://localhost:8081' }}
          NEXT_PUBLIC_WS_URL: ${{ vars.NEXT_PUBLIC_WS_URL || 'ws://localhost:8080/ws' }}
        run: pnpm build

      - name: Upload Next build artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: blackridge-frontend-next
          path: |
            .next
            public
            package.json
            pnpm-lock.yaml
            next.config.mjs
          retention-days: 14

  deploy:
    name: Deploy to VPS (next start under systemd)
    needs: test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: blackridge
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download Next build artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: blackridge-frontend-next
          path: ./release

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Stage release tarball on VPS
        # Ship build output + manifest only; node_modules is installed on the host
        # via `pnpm install --prod` so we don't rsync pnpm's symlinked store.
        # starsky owns /tmp and is in the blackheart-frontend group; /opt/blackheart-frontend
        # is 775 so starsky can create release dirs without sudo.
        env:
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
        run: |
          VERSION="${GITHUB_SHA::8}"
          REMOTE_DIR="/opt/blackheart-frontend/releases/${VERSION}"
          tar -czf release.tar.gz -C release .
          scp -i ~/.ssh/id_ed25519 release.tar.gz "${SSH_USER}@${SSH_HOST}:/tmp/release-${VERSION}.tar.gz"
          ssh -i ~/.ssh/id_ed25519 "${SSH_USER}@${SSH_HOST}" "set -e && mkdir -p ${REMOTE_DIR} && tar -xzf /tmp/release-${VERSION}.tar.gz -C ${REMOTE_DIR} && rm /tmp/release-${VERSION}.tar.gz"
          echo "REMOTE_DIR=${REMOTE_DIR}" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Install production dependencies on host
        # Run as starsky directly (already in the blackheart-frontend group with write
        # access to the release dir). Chown to blackheart-frontend happens after install
        # so the service account owns the final tree.
        env:
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "${SSH_USER}@${SSH_HOST}" "set -e && cd ${REMOTE_DIR} && pnpm install --prod --frozen-lockfile"

      - name: Hand release tree to service account
        # sudoers whitelist: BLACKHEART_FRONTEND_DEPLOY allows this exact chown pattern
        # on /opt/blackheart-frontend/releases/*.
        env:
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "${SSH_USER}@${SSH_HOST}" "sudo chown -R blackheart-frontend:blackheart-frontend ${REMOTE_DIR}"

      - name: Capture rollback target
        env:
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
        run: |
          PREV=$(ssh -i ~/.ssh/id_ed25519 "${SSH_USER}@${SSH_HOST}" "readlink /opt/blackheart-frontend/current 2>/dev/null || echo NONE")
          echo "PREV_DIR=${PREV}" >> "$GITHUB_ENV"
          echo "Previous symlink target: ${PREV}"

      - name: Stop -> swap symlink -> start
        # Single-line ssh (no heredoc). Heredocs in YAML block-scalars hit indentation
        # traps where the closing EOF is read as content, hanging bash parsing.
        # NOTE: sudoers whitelist uses `ln -sf` (not `-sfn`); keep the flag exact.
        env:
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "${SSH_USER}@${SSH_HOST}" "set -e && sudo systemctl stop blackheart-frontend && sudo ln -sf ${REMOTE_DIR} /opt/blackheart-frontend/current && sudo systemctl start blackheart-frontend"

      - name: Healthcheck (with rollback on failure)
        # 12 attempts × 10s = 120s. Next.js cold-boot is ~5–8s; 120s absorbs first-
        # request compile + GC warmup variance. If readiness never returns 200 we
        # re-point the symlink at PREV_DIR and bounce the service.
        env:
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
        run: |
          set +e
          ssh -i ~/.ssh/id_ed25519 "${SSH_USER}@${SSH_HOST}" 'for i in $(seq 1 12); do curl -fsS -o /dev/null http://127.0.0.1:3000/ && exit 0; sleep 10; done; exit 1'
          HEALTH=$?
          set -e
          if [ "$HEALTH" -ne 0 ]; then
            echo "::error::Healthcheck failed. Rolling back to ${PREV_DIR}."
            if [ "${PREV_DIR}" != "NONE" ]; then
              ssh -i ~/.ssh/id_ed25519 "${SSH_USER}@${SSH_HOST}" "set -e && sudo systemctl stop blackheart-frontend && sudo ln -sf ${PREV_DIR} /opt/blackheart-frontend/current && sudo systemctl start blackheart-frontend"
            fi
            exit 1
          fi
          echo "Deploy ${VERSION} healthy."

      - name: Tag successful production deploy
        # Lightweight git tag — searchable, no release notes overhead. Format:
        # deploy/prod/<8-char-sha>. Reuse: `git fetch --tags && git checkout deploy/prod/<sha>`.
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="deploy/prod/${GITHUB_SHA::8}"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${TAG}" \
            -f "sha=${GITHUB_SHA}" \
            > /dev/null && echo "Tagged ${TAG}" || echo "::warning::Tag ${TAG} may already exist (non-fatal)"
