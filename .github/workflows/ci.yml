name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false  # never cancel master builds — a half-shipped deploy is worse than a slow queue

# Least-privilege at the workflow level. Individual jobs cannot escalate beyond this.
# - contents: write       — required so the deploy job can push the deploy/prod/<sha> tag.
# - actions: read         — for downloading own build artifact across jobs.
# - deployments: write    — populates the Deployments tab in the blackridge environment.
# - packages: write       — pushes the container image to ghcr.io/<owner>/blackheart-frontend.
permissions:
  contents: write
  actions: read
  deployments: write
  packages: write

# Image-registry conventions. Owner is lowercased from github.repository_owner
# so ghcr.io accepts it (GHCR rejects mixed case).
env:
  REGISTRY: ghcr.io
  IMAGE_FRONTEND: ${{ github.repository_owner }}/blackheart-frontend

jobs:
  test:
    name: Build (lint/typecheck skipped for now)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to commit SHAs (supply-chain hardening). Update the SHA
      # AND the trailing `# vX.Y.Z` comment together; never trust a moving major tag.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20.x"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Lint + typecheck are intentionally skipped right now. The working tree has CRLF
      # line endings that trip prettier, and there are pre-existing tsc complaints that
      # aren't tied to this CI rollout. Build is the gate: a green build means the bundle
      # ships. Re-enable lint/typecheck once those debts are paid down.

      - name: Build
        # Build-time NEXT_PUBLIC_* are baked into the bundle. Values come from repo
        # variables when set; localhost fallbacks let the build succeed on a fresh
        # clone without any secrets configured.
        # `--no-lint` because `next build` runs ESLint by default and the working
        # tree has unrelated CRLF/prettier/a11y debt. Same rationale as the
        # skipped Lint/Typecheck steps above — build is the gate, not lint.
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:8080' }}
          NEXT_PUBLIC_RESEARCH_URL: ${{ vars.NEXT_PUBLIC_RESEARCH_URL || 'http://localhost:8081' }}
          NEXT_PUBLIC_WS_URL: ${{ vars.NEXT_PUBLIC_WS_URL || 'ws://localhost:8080/ws' }}
        run: pnpm exec next build --no-lint

      - name: Upload Next build artifact (emergency debug only)
        # The deploy path no longer consumes this artifact — the Docker image is
        # the source of truth. Kept as an escape hatch: if a future incident
        # requires inspecting the exact .next output for a given SHA without
        # pulling the image, it's downloadable from the run page.
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: blackridge-frontend-next-debug
          path: |
            .next
            package.json
            pnpm-lock.yaml
            next.config.mjs
          retention-days: 14

  build-images:
    name: Build + push GHCR image
    needs: test
    # Same gate as deploy: only build images on master pushes or manual dispatch.
    # PR builds run the test job (above) but skip image push — PRs aren't deployable.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      # Surface the image tag to the downstream deploy job so it doesn't have to
      # recompute it. Pinned to the run's commit SHA — that's what ends up
      # in /home/starsky/blackheart/.env on the VPS as FRONTEND_TAG.
      sha_tag: ${{ steps.tag.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Compute tag (short SHA)
        id: tag
        run: echo "sha_tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db # v3.6.1

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push frontend image
        # NEXT_PUBLIC_* are passed as Docker build args. Next.js inlines them
        # into the client bundle at `next build` time, so they CANNOT be
        # changed by env vars at `docker run` — every URL change requires a
        # rebuild. Localhost fallbacks let `docker build` succeed without any
        # repo vars configured (useful for `pnpm e2e` against a hand-built
        # image), but real deploys override them.
        # Two tags pushed: the immutable SHA tag (what the VPS pins to via
        # FRONTEND_TAG) and `latest` (operator escape hatch — never used by
        # CI deploys, but handy for `docker pull` smoke tests).
        uses: docker/build-push-action@5cd11c3a4ced054e52742c5fd54dca954e0edd85 # v6.7.0
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:8080' }}
            NEXT_PUBLIC_RESEARCH_URL=${{ vars.NEXT_PUBLIC_RESEARCH_URL || 'http://localhost:8081' }}
            NEXT_PUBLIC_WS_URL=${{ vars.NEXT_PUBLIC_WS_URL || 'ws://localhost:8080/ws' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:${{ steps.tag.outputs.sha_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:latest
          push: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    name: Deploy frontend to VPS (docker compose)
    needs: build-images
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: blackridge
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure SSH
        # Trim whitespace from VPS_HOST/VPS_USER defensively — if the secret
        # was set with a trailing newline (`gh secret set < file` or PowerShell
        # pipe quirks), scp errors with "hostname contains invalid characters".
        # Same `tr -d` idiom the trading repo uses for psql captures.
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST_RAW: ${{ vars.VPS_HOST }}
          SSH_USER_RAW: ${{ vars.VPS_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          SSH_HOST=$(printf '%s' "$SSH_HOST_RAW" | tr -d '[:space:]')
          SSH_USER=$(printf '%s' "$SSH_USER_RAW" | tr -d '[:space:]')
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          echo "SSH_HOST=${SSH_HOST}" >> "$GITHUB_ENV"
          echo "SSH_USER=${SSH_USER}" >> "$GITHUB_ENV"

      - name: Capture rollback tag
        # docker inspect reads the currently-running container's image. Image
        # ref shape: `ghcr.io/<owner>/blackheart-frontend:<sha>`. We split off
        # the tag suffix and stash it. NONE = no prior deploy (first-ever run),
        # in which case rollback is skipped.
        run: |
          PREV=$(ssh -i ~/.ssh/id_ed25519 "${SSH_USER}@${SSH_HOST}" "docker inspect blackheart-frontend --format '{{.Config.Image}}' 2>/dev/null | awk -F: '{print \$NF}' || echo NONE")
          echo "PREV_TAG=${PREV:-NONE}" >> "$GITHUB_ENV"
          echo "Previous frontend tag: ${PREV}"

      - name: Pin new tag in /home/starsky/blackheart/.env
        # The compose file reads ${FRONTEND_TAG:-latest}. We append/overwrite
        # the FRONTEND_TAG line so `compose up -d frontend` picks the SHA we
        # just built. `grep -v` + `>>` is the atomic-enough replace pattern
        # that avoids needing `sed -i` across distros. The compose YAML itself
        # is owned by the trading-engine repo's deploy job — we don't sync it
        # here, only mutate the tag pin.
        env:
          NEW_TAG: ${{ needs.build-images.outputs.sha_tag }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "${SSH_USER}@${SSH_HOST}" \
            "set -e && touch /home/starsky/blackheart/.env && grep -v '^FRONTEND_TAG=' /home/starsky/blackheart/.env > /tmp/.env.new || true && echo 'FRONTEND_TAG=${NEW_TAG}' >> /tmp/.env.new && mv /tmp/.env.new /home/starsky/blackheart/.env"
          echo "NEW_TAG=${NEW_TAG}" >> "$GITHUB_ENV"

      - name: Pull + recreate frontend container
        # `compose pull` is idempotent. `compose up -d frontend` recreates only
        # the frontend container (postgres/redis/trading/etc keep running).
        run: |
          ssh -i ~/.ssh/id_ed25519 "${SSH_USER}@${SSH_HOST}" \
            "cd /home/starsky/blackheart && docker compose pull frontend && docker compose up -d frontend"

      - name: Frontend healthcheck (with rollback on failure)
        # 12 attempts × 10s = 120s. Next.js cold-boot is ~5–8s; 120s absorbs
        # first-request compile + GC warmup variance.
        # `-fsS` makes curl fail on 4xx/5xx but allow 2xx/3xx — the app
        # redirects unauth users to /login as a 307, which is "up" for our
        # purposes. If readiness never comes back 2xx/3xx we re-pin PREV_TAG
        # and bring the container up again.
        run: |
          set +e
          ssh -i ~/.ssh/id_ed25519 "${SSH_USER}@${SSH_HOST}" \
            'for i in $(seq 1 12); do curl -fsS -o /dev/null http://127.0.0.1:3000/ && exit 0; sleep 10; done; exit 1'
          HEALTH=$?
          set -e
          if [ "$HEALTH" -ne 0 ]; then
            echo "::error::Frontend healthcheck failed. Rolling back to ${PREV_TAG}."
            if [ "${PREV_TAG}" != "NONE" ]; then
              ssh -i ~/.ssh/id_ed25519 "${SSH_USER}@${SSH_HOST}" \
                "set -e && grep -v '^FRONTEND_TAG=' /home/starsky/blackheart/.env > /tmp/.env.rollback && echo 'FRONTEND_TAG=${PREV_TAG}' >> /tmp/.env.rollback && mv /tmp/.env.rollback /home/starsky/blackheart/.env && cd /home/starsky/blackheart && docker compose up -d frontend"
            fi
            exit 1
          fi
          echo "Frontend deploy ${NEW_TAG} healthy."

      - name: Tag successful production deploy
        # Lightweight git tag — searchable, no release notes overhead. Format:
        # deploy/prod/<8-char-sha>. Reuse: `git fetch --tags && git checkout deploy/prod/<sha>`.
        # The trading-engine deploy workflow also tags deploy/prod/<sha> on the
        # SAME commit SHA when both repos happen to target the same prod SHA.
        # `|| echo ::warning::` swallows the 422 "ref already exists" — duplicate
        # tag is non-fatal, the deploy itself succeeded.
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="deploy/prod/${GITHUB_SHA::8}"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${TAG}" \
            -f "sha=${GITHUB_SHA}" \
            > /dev/null && echo "Tagged ${TAG}" || echo "::warning::Tag ${TAG} may already exist (non-fatal)"
